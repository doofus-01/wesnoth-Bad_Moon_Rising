[event]
    name=prestart
    priority=4 # I'm not sure what a good value is
    [event]
        name=start # because 'unit placed' does not cover all units on the map at start
        [fire_event]
            name=bmr_scale_trait
        [/fire_event]
    [/event]
    [event]
        name=unit placed
        priority=2
        first_time_only=no
        [fire_event]
            name=bmr_scale_trait
        [/fire_event]
    [/event]
[/event]

#enddef
