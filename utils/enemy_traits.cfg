#textdomain wesnoth-Bad_Moon_Rising

# these replace the normal traits with slightly larger boosts

#define BMR_SCALE_TRAIT_STRONG LVL NAME FEMALE_NAME EFFECT
    # Units with trait Strong get a +1 increment in hitpoints and melee damage.
    [trait]
        id=bmr_strong_{LVL}
        male_name= {NAME}
        female_name= {FEMALE_NAME}
        help_text= "<i>"+{NAME}+"</i>"+_" units do more damage for every successful strike in melee combat, and have 5% additional hitpoint."
        [effect]
            apply_to=attack
            range=melee
            increase_damage={LVL}
        [/effect]
        [effect]
            apply_to=hitpoints
            increase_total=5%
        [/effect]
        {EFFECT}
    [/trait]
#enddef

#define BMR_SCALE_TRAIT_DEXTROUS LVL NAME FEMALE_NAME EFFECT
    [trait]
        id=bmr_dextrous_{LVL}
        male_name= {NAME}
        female_name= {FEMALE_NAME}
        help_text= _ "<i>"+{NAME}+"</i>"+_" units do more damage for every successful strike in ranged combat."
        [effect]
            apply_to=attack
            range=ranged
            increase_damage={LVL}
        [/effect]
        {EFFECT}
    [/trait]
#enddef

#define BMR_SCALE_TRAIT_QUICK LVL NAME FEMALE_NAME EFFECT
    [trait]
        id=bmr_quick_{LVL}
        male_name= {NAME}
        female_name= {FEMALE_NAME}
        help_text= _ "<i>"+{NAME}+"</i>"+_" units have extra movement points, but 5% less hitpoints than usual."
        [effect]
            apply_to=movement
            increase={LVL}
        [/effect]
        [effect]
            apply_to=hitpoints
            increase_total=-5%
        [/effect]
        {EFFECT}
    [/trait]
#enddef

#define BMR_SCALE_TRAIT_INTELLIGENT LVL NAME FEMALE_NAME EFFECT
    [trait]
        id=bmr_intelligent_{LVL}
        male_name= {NAME}
        female_name= {FEMALE_NAME}
        help_text= _ "<i>"+{NAME}+"</i>"+_" units require less experience than usual to advance."
        [effect]
            apply_to=hitpoints
            increase_total={LVL}
        [/effect]
        [effect]
            apply_to=max_experience
            increase=-20%
        [/effect]
        {EFFECT}
    [/trait]
#enddef

#define BMR_SCALE_TRAIT_RESILIENT LVL NAME FEMALE_NAME EFFECT
    [trait]
        id=bmr_resilient_{LVL}
        male_name= {NAME}
        female_name= {FEMALE_NAME}
        help_text= _ "<i>"+{NAME}+"</i>"+_" units have an additional hitpoints, and gain more per level."
        [effect]
            apply_to=hitpoints
            increase_total=20%
        [/effect]
        [effect]
            apply_to=hitpoints
            times=per level
            increase_total={LVL}
        [/effect]
        {EFFECT}
    [/trait]
#enddef

