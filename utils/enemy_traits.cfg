#define BMR_TRAIT_SWAP TRAIT_OLD_ID TRAIT_NEW_MACRO
[store_unit]
    [filter]
        [filter_side]
            controller=ai
            [has_enemy]
                controller=human
            [/has_enemy]
        [/filter_side]
        formula = "index_of('{TRAIT_OLD_ID}',self.traits)!=-1"
    [/filter]
    variable=bmr_trait_swap_TMP
    kill=no
[/store_unit]
[if]
    [variable]
        name = bmr_trait_swap_TMP.modifications.trait[0].id
        equals = "{TRAIT_OLD_ID}"
    [/variable]
    [then]
        {CLEAR_VARIABLE bmr_trait_swap_TMP.modifications.trait[0]}
        [unstore_unit]
            variable=bmr_trait_swap_TMP
            find_vacant = no
        [/unstore_unit]
    [/then]
    [else]
        [if]
            [variable]
                name = bmr_trait_swap_TMP.modifications.trait[1].id
                equals = "{TRAIT_OLD_ID}"
            [/variable]
            [then]
                {CLEAR_VARIABLE bmr_trait_swap_TMP.modifications.trait[1]}
                [unstore_unit]
                    variable=bmr_trait_swap_TMP
                    find_vacant = no
                [/unstore_unit]
            [/then]
        [/if]
    [/else]
[/if]
[modify_unit]
    [filter]
        id=$bmr_trait_swap_TMP.id
    [/filter]
    {TRAIT_NEW_MACRO}
[/modify_unit]
{CLEAR_VARIABLE bmr_trait_swap_TMP}
#enddef

#define BMR_SCALE_TRAITS

#        [set_variable]
#            name=sknumber
 #           add=$bmr_map_stage|
 #       [/set_variable]
[event]
    name=bmr_scale_trait
    first_time_only=no
        [switch]
            variable=bmr_map_stage
            [case]
                value="0"
                {BMR_TRAIT_SWAP strong ({BMR_SCALE_TRAIT_STRONG_1})}
                {BMR_TRAIT_SWAP dextrous ({BMR_SCALE_TRAIT_DEXTROUS_1})}
                {BMR_TRAIT_SWAP quick ({BMR_SCALE_TRAIT_QUICK_1})}
                {BMR_TRAIT_SWAP intelligent ({BMR_SCALE_TRAIT_INTELLIGENT_1})}
                {BMR_TRAIT_SWAP resilient ({BMR_SCALE_TRAIT_RESILIENT_1})}
            [/case]
            [case]
                value="1"
                {BMR_TRAIT_SWAP strong ({BMR_SCALE_TRAIT_STRONG_2})}
                {BMR_TRAIT_SWAP dextrous ({BMR_SCALE_TRAIT_DEXTROUS_2})}
                {BMR_TRAIT_SWAP quick ({BMR_SCALE_TRAIT_QUICK_1})}
